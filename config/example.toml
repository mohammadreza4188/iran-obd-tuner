# Iran OBD Tuner — example configuration
#
# Copy this file to config/local.toml and edit it for your machine:
#     cp config/example.toml config/local.toml
#
# config/local.toml is ignored by Git (machine specific settings must not be committed).
# Every value can also be supplied through environment variables; the variable name is
# IRAN_OBD_TUNER_<FIELD_NAME_UPPERCASED> (e.g. IRAN_OBD_TUNER_ADAPTER, IRAN_OBD_TUNER_LOG_LEVEL).
# Precedence: built-in defaults  <  this file  <  environment variables.
#
# The default configuration is safe: it talks to the simulated adapter only and performs
# read-only diagnostics. No option in this file can enable ECU write or calibration operations.

# Adapter to use. See `iran-obd-tuner adapters` for declared adapters and their status.
# Implemented: "mock" (simulated) and "elm327" (read-only, needs serial_port; not yet
# validated on real hardware).
# Env: IRAN_OBD_TUNER_ADAPTER
adapter = "mock"

# Serial port of a real adapter. Required for "elm327": the port is never probed
# automatically, because probing would send commands to unknown devices. Leave unset for
# the mock adapter.
# Env: IRAN_OBD_TUNER_SERIAL_PORT
# serial_port = "COM3"

# Serial baud rate of the adapter. ELM327 clones are usually 38400; some ship with 115200.
# Env: IRAN_OBD_TUNER_SERIAL_BAUDRATE
serial_baudrate = 38400

# Seconds to wait for the adapter to answer a connection attempt (allowed: 5 to 60).
# Env: IRAN_OBD_TUNER_CONNECT_TIMEOUT_S
connect_timeout_s = 5.0

# Seconds to wait for the response of a single diagnostic request (allowed: 0.5 to 10).
# Env: IRAN_OBD_TUNER_COMMAND_TIMEOUT_S
command_timeout_s = 2.0

# OBD-II service 01 parameters read by the diagnostic workflow, in request form
# (mode + PID). See src/iran_obd_tuner/core/pids.py for the built-in catalogue.
# Env: IRAN_OBD_TUNER_LIVE_DATA_PIDS (comma separated)
live_data_pids = ["010C", "010D", "0105", "0111", "010F", "0142"]

# Logging level: DEBUG, INFO, WARNING, ERROR or CRITICAL.
# Env: IRAN_OBD_TUNER_LOG_LEVEL
log_level = "INFO"

# Optional log file. Logs go to stderr when unset. Parent directories are created.
# Env: IRAN_OBD_TUNER_LOG_FILE
# log_file = "output/iran-obd-tuner.log"

# Directory for generated artefacts (diagnostic reports, logs, later live-data captures).
# Env: IRAN_OBD_TUNER_OUTPUT_DIR
output_dir = "output"

# Optional extra knowledge data directory. Files placed here override the bundled
# knowledge database: dtc_catalog.json, and vehicles/*.json vehicle packs (a local vehicle
# replaces the bundled one with the same id). Use it for research data that is
# not ready to be committed, e.g. "knowledge/local".
# Env: IRAN_OBD_TUNER_KNOWLEDGE_DIR
# knowledge_dir = "knowledge/local"

# Virtual dyno defaults (estimated power/torque; the dashboard can change them per session).
# The curb mass has no default: enter your vehicle's mass from its documents.
# Env: IRAN_OBD_TUNER_DYNO_CURB_MASS_KG, IRAN_OBD_TUNER_DYNO_EXTRA_MASS_KG, ...
# dyno_curb_mass_kg = 1100.0
# Generic values below; they are not the specification of any particular vehicle.
dyno_extra_mass_kg = 75.0          # driver, passengers, cargo
dyno_drag_coefficient = 0.33
dyno_frontal_area_m2 = 2.0
dyno_drivetrain_loss = 0.15        # fraction lost between crank and wheels
dyno_rolling_resistance = 0.013
dyno_air_density_kg_m3 = 1.06      # about 1200 m altitude

# UDS ECU identification over CAN (read-only: DIDs via 0x22, DTCs via 0x19).
# can_interface: "virtual-sim" = simulated ECU on python-can's in-process virtual bus
# (every value it returns is simulated); real interfaces need the [can] extra and a channel:
# "slcan" (COM5, /dev/ttyACM0), "pcan" (PCAN_USBBUS1), "kvaser" (0). Real interfaces only at
# 250000 or 500000 bit/s; each is probed listen-only before the first transmission.
# Env: IRAN_OBD_TUNER_CAN_INTERFACE, IRAN_OBD_TUNER_CAN_CHANNEL, ...
can_interface = "virtual-sim"
# can_channel = "COM5"
can_bitrate = 500000
# ISO 15765-4 default engine ECU pair. NOT verified for any specific vehicle
# (e.g. the Peugeot Pars TU5): use the dashboard's "discover ECUs" first.
uds_request_id = "0x7E0"
uds_response_id = "0x7E8"
isotp_padding = "0xCC"             # "none" to send unpadded frames
# The extended diagnostic session (0x10 0x03) is intentionally not configurable here.
