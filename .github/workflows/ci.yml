name: CI

on:
  push:
    branches: [main]
  pull_request:

# The core package is standard-library only, so every check below runs without hardware,
# without an OBD adapter and without the GUI or CAN dependency stacks.
# The [obd], [can], [bench] and [gui] extras are deliberately NOT installed here: they pull
# in compiled/GUI wheels and can only be validated manually, see docs/development.md.

jobs:
  checks:
    name: lint, format, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q
